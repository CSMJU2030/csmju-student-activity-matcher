# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-student-activity-matcher          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.8.4"
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

# หน้าเว็บ (Next.js) เป็น origin เดียวของระบบ — /api/* และ /auth/* ส่งต่อไป NestJS
# (frontend/next.config.ts) คุกกี้ SSO กับ callback จึงอยู่ origin เดียวกับหน้าเว็บ
base_url: http://localhost:3001
core_hub_url: http://localhost:3000
core_hub_web_url: http://localhost:3100   # เว็บของ Core Hub ที่ /auth/login ส่งเบราว์เซอร์ไป
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
probes:
  collection: /api/v1/activities
  not_found: /api/v1/activities/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/activities/not-a-uuid
  create:
    path: /api/v1/activities
    allowed_role: student
    denied_role: alumni
    invalid_body:
      title: ""
    valid_body:
      title: Conformance probe
      description: never created - only sent with the denied role
      date: "2099-01-01"
      time: "10:00"
      location: Lab 1
      capacity: 10

owners:
  pl: "@csmju2030/pl-student-activity-matcher"
  aie: "@csmju2030/aie-student-activity-matcher"

display_name: "Student Activity Matcher"
repo: github.com/CSMJU2030/csmju-student-activity-matcher
status: proposed
